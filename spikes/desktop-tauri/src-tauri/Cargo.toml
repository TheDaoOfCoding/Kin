[package]
name = "kin"
version = "0.1.0"
description = "Kin Relay desktop app (Phase 0 Tauri spike)"
authors = ["Kin Relay"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
