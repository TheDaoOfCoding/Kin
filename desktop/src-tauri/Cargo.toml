[package]
name = "kin"
version = "0.1.0"
description = "Kin Relay desktop app"
authors = ["Kin Relay"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kin_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
getrandom = "0.4.3"
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
log = { version = "0.4.34", features = ["std"] }
mdns-sd = "0.21.5"
qrcode = "0.14.1"
rcgen = "0.14.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "logging"] }
rustls-webpki = { version = "0.103.15", default-features = false, features = ["aws-lc-rs", "std"] }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.6.0"
tauri-plugin-single-instance = "2.5.3"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
tungstenite = { version = "0.29", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
x509-parser = "0.18.1"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"

[dev-dependencies]
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tempfile = "3.27.0"
aws-lc-rs = "1.18.2"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
